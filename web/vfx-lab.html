<!doctype html>
<meta charset="utf-8">
<title>물금 VFX 실험</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  /* 물금 실시간 VFX 효과 단독 실험 화면 (SPEC-005 §15.1 단계 B). 캐릭터 없이 경로·소멸만 본다 */
  :root { --bg: #101820; --ink: #fff1d7; --dim: #b7b6b6; --gold: #d9b77c; --plate: rgba(9, 15, 24, 0.86); color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  .lab { position: fixed; inset: 0; display: grid; grid-template-rows: 1fr auto; }
  canvas#view { width: 100%; height: 100%; display: block; }
  .panel { padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--plate); border-top: 1px solid var(--gold); display: grid; gap: 8px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row > b { min-width: 4.5em; color: var(--dim); font-weight: 600; }
  select { min-height: 36px; background: #111d2b; color: var(--ink); border: 1px solid #4a4538; font: inherit; }
  button { min-height: 36px; padding: 0 12px; border: 1px solid #4a4538; background: #111d2b; color: var(--ink); font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: #ffe0a1; color: #ffe0a1; }
  button.swatch { width: 44px; padding: 0; }
  button.swatch[aria-pressed="true"] { outline: 2px solid #ffe0a1; outline-offset: 2px; }
  input[type="range"] { flex: 1 1 240px; }
  label { display: inline-flex; align-items: center; gap: 4px; }
  #readout { font-variant-numeric: tabular-nums; white-space: pre; color: var(--ink); overflow-x: auto; }
  .note { color: var(--dim); font-size: 12px; }
</style>
<body>
<div class="lab">
  <canvas id="view"></canvas>
  <div class="panel">
    <div id="readout">불러오는 중…</div>
    <div class="row">
      <button id="play" type="button">정지</button>
      <button id="replay" type="button">다시</button>
      <input id="time" type="range" min="0" max="1160" step="1" value="0" aria-label="효과 시각 (ms)">
      <label><input id="loop" type="checkbox" checked> 반복</label>
    </div>
    <div class="row"><b>배속</b><span id="rates" class="row"></span><b>프레임</b><span id="fps" class="row"></span></div>
    <div class="row"><b>배경</b><span id="bg" class="row"></span>
      <button id="facing" type="button">방향: 오른쪽</button>
      <label><input id="debug" type="checkbox" checked> 경로·꼬리(주황)/머리(초록)·u 화살표·발 기준점</label>
      <label><input id="glow" type="checkbox" checked> 빛(가산)</label>
      <label><input id="drops" type="checkbox" checked> 물방울</label>
      <label>원본 비교 <select id="compare"><option value="off">끔</option><option value="side" selected>나란히</option><option value="over">겹쳐(원본 50%)</option></select></label>
    </div>
    <div class="note">효과 단독 테스트 — 카일 본체 합성 아님 (깨끗한 본체·앵커 승인 전). 모양·색은 원본 S1 물결 베기(01 장)를 눈으로 맞춘 것. 원본 비교는 참고용.</div>
  </div>
</div>
<script type="module" src="vfx-lab.js"></script>
</body>
