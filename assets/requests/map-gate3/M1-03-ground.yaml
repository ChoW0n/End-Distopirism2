  perspective: "2.5D 원근 카메라, 눈높이보다 약간 위. 기존 assets/map 4층과 같은 층 구성·지평선 높이"
  layer_alpha: "RGBA. 지평선 위는 알파 0"
  screen_zones: "화면 위 11%·아래 26% 는 UI 가 덮는다(SPEC-007 §9.4). 중요한 형태는 그 사이에 둔다"
