task:
  asset_name: "map-gate3/M1-03-ground"
  purpose: "background"
  requested_change: "[바닥 층] 지평선(이미지 높이의 약 45%) 아래로 원근이 들어간 젖은 콘크리트 바닥. 얕은 물웅덩이·배수구·쓸려온 천 조각. 캐릭터가 서는 가운데 넓은 영역은 평평하고 읽기 쉽게. 장소: 제3 수문 안쪽 점검 통로. 6년 전 봉쇄된 거대한 수문과 점검실, 반쯤 잠긴 콘크리트 바닥. 여러 높이에 겹친 수위 자국과 날짜, 물이 빠진 벽 아래쪽 색 차이, 배관·기계식 계기(실제 연결 위치가 보이게), 닫힌 문, 비상등. 톱니바퀴·체인·붉은 눈 장식 반복 금지. 사람 없음"
  approved_base_version: "M1-01-far 승인본"
  input_files: []
  references:
    - file: "assets/map/far.png · mid.png · ground.png · front.png (기존 층 구성)"
      role: "style"
      inspected: false

