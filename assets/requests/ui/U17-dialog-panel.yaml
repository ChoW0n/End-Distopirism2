# UI 제작 요청 U17 · 겹창 판 (SPEC-004 §13.3)
# 양식: docs/참고/gpt-astra-이미지제작-능력.md §15. null·빈 목록은 합의 전 상태다
task:
  asset_name: "U17-dialog-panel"
  purpose: "ui"
  requested_change: "도움말·메뉴가 화면 가운데에 뜰 때의 바탕판. 9분할로 늘어난다"
  approved_base_version: null
  input_files: []
  references:
    - file: "게임 화면 캡처 (요청 시 첨부)"
      role: "style"
      inspected: false

constraints:
  target_size_reference_units: "960x640"
  size_note: "기준 단위(1920×1080 화면) 크기다. 원본은 이 크기의 2배로 준다(iPhone 15 는 1.09배로 보인다). 정확히 못 맞추면 비율만 지키고 크게 준다. 크기 맞춤·9분할은 반입 도구가 한다"
  states: [normal]
  one_file_per_state: true
  no_text_in_image: true
  tone: "무채색·브라운 기반, 강한 명암 대비, 거친 마모 질감, 균열·녹·벗겨진 페인트 (배경·UI 재질 톤, CLAUDE.md · STORY-001 §18). 재질: 녹슨 철판·찢긴 테이프·스텐실 (SPEC-006 A-5 제안, 미확정)"
  output_alpha: "투명 배경 (RGBA). 배경 알파 0"
  runtime_blend_mode: "일반 알파"
  preserve: []
  allowed_changes: []
  note: "안쪽에 글을 많이 얹으므로 가운데는 고르고 어둡게"

delivery:
  result_files: []
  generation_prompt: ""

verification:
  file_checks: []        # 반입 도구: RGBA 여부, 배경 알파 0, 크기
  visual_checks: []      # 밝은·어두운 배경 합성 캡처, 1920×1080 · iPhone 15(2556×1179) 화면 안 배치 캡처
  engine_checked: false
  user_approved: false
  remaining_failures: []
  unverified: []

handoff:
  next_owner: "gpt astra"
  next_action: "상태별로 한 장씩 생성해 결과 파일과 남은 문제를 적어 돌려준다"
