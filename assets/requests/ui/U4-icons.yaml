# UI 제작 요청 U4 · 아이콘 16종 (SPEC-004 §13.3, SPEC-007 §9.5 에서 바뀜)
# 양식: docs/참고/gpt-astra-이미지제작-능력.md §15. null·빈 목록은 합의 전 상태다
task:
  asset_name: "U4-icons"
  purpose: "ui"
  requested_change: "메뉴, 도움말, 자동 전투, 배속, 소리 켬, 소리 끔, 재시작, 공격, 방어, 보조, 궁극기, 체력, 정신력, 노림(적이 아군을 겨눔), 선택 표시(▼), 가로로 돌리기. 한 아이콘 = 파일 1개. 단색(흰색) 실루엣 + 알파. 스텐실로 찍은 듯한 거친 가장자리. iPhone 에서 35pt 정도로 보여도 구분돼야 한다"
  approved_base_version: null
  input_files: []
  references:
    - file: "게임 화면 캡처 (요청 시 첨부)"
      role: "style"
      inspected: false

constraints:
  target_size_reference_units: "96x96 each"
  size_note: "목표값이다. 정확히 못 맞추면 비율만 지키고 크게 준다. 크기 맞춤·9분할은 반입 도구가 한다"
  states: [single]
  one_file_per_state: true
  no_text_in_image: true
  tone: "무채색·브라운 기반, 강한 명암 대비, 거친 마모 질감, 균열·녹·벗겨진 페인트 (배경·UI 재질 톤, CLAUDE.md · STORY-001 §18). 재질: 녹슨 철판·찢긴 테이프·스텐실 (SPEC-006 A-5 제안, 미확정)"
  output_alpha: "투명 배경 (RGBA). 배경 알파 0"
  runtime_blend_mode: "일반 알파"
  preserve: []
  allowed_changes: []
  note: "16개를 한 장에 모으지 않는다. 막아서기·교란·근접·원거리·이동·묶임·되돌리기는 SPEC-007 확정 뒤 다시 요청한다"

delivery:
  result_files: []
  generation_prompt: ""

verification:
  file_checks: []        # 반입 도구: RGBA 여부, 배경 알파 0, 크기
  visual_checks: []      # 밝은·어두운 배경 합성 캡처, 게임 화면 안 배치 캡처
  engine_checked: false
  user_approved: false
  remaining_failures: []
  unverified: []

handoff:
  next_owner: "gpt astra"
  next_action: "상태별로 한 장씩 생성해 결과 파일과 남은 문제를 적어 돌려준다"
