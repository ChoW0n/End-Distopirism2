  facing: "화면 오른쪽을 본다 (아군 쪽 보호 대상)"
  target_height_px: "캐릭터 키(정수리~발바닥) 1400px 이상. 무기 끝·머리카락·발이 잘리지 않게 사방 여백. 정규화(키 700px·WebP)는 반입 도구가 한다 (SPEC-006 §3.1)"
  proportion: "기존 조력자·소각원 전투 장과 같은 등신. 하반신을 늘리지 않는다. 나란히 놓고 비교한다"
  tone: "캐릭터 셀화풍: 검은 외곽선 + 평면 2~3단 셰이딩. 무채색 바탕 + 고유색 1개(낮은 채도). 배경 질감(녹·균열)을 몸·옷에 덧씌우지 않는다 (CLAUDE.md · STORY-001 §18)"
