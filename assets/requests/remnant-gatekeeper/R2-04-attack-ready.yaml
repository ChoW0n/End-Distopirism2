  approved_base_version: "R2-01-idle 승인본"
  input_files: []
  references:
    - file: "R1-01-idle 승인본"
      role: "style"
      inspected: false

constraints:
  anatomical_handedness: null
  weapon_mount: null
  camera_view: "담당이 정한다. 용도: 2.5D 원근 무대 위에 서는 전투 스프라이트라 기존 전투 장과 나란히 놓았을 때 어울려야 한다. 발끝까지 전신"
  autonomy: "자세·동작 각도·구도·방향은 담당이 정한다. 이 요청서는 용도와 목적만 말한다. 고른 이유를 납품 때 한 줄로 적는다"
  facing: "적 쪽이라 화면 왼쪽에 카일이 있다. 좌우 반전 없이 이 방향으로 쓴다"
  target_height_px: "캐릭터 키(정수리~발바닥) 1400px 이상. 무기 끝·머리카락·발이 잘리지 않게 사방 여백. 정규화(키 700px·WebP)는 반입 도구가 한다 (SPEC-006 §3.1)"
  scale: "카일과 한 화면에서 함께 크게 보여야 한다. 보스라고 카메라를 멀리 빼지 않는다 (STORY-001 §16). 크기는 담당이 정한다"
  tone: "잔형: 무채색 본체 + 청회색 젖은 면 + 작은 침전 결정. 고유색 없음. 정교한 얼굴 없음. 외곽선 굵기·셰이딩 단계는 캐릭터와 같게 맞춘다 (STORY-001 §5.2 · §16 · §18)"
  one_file_per_pose: true
  no_text_in_image: true
  output_alpha: "투명 배경 (RGBA). 배경 알파 0. 바닥 그림자를 그리지 않는다 (코드가 그린다)"
  runtime_blend_mode: "일반 알파"
  preserve:
