  requested_change: "[막기] 용도: 막아서기 카드: 동료나 보호 대상에게 오는 공격을 대신 받아내는 순간. 목적: 공격을 받아내고 있다는 게 읽힌다. 이기면 K-08 로 반격이 이어진다. 자세·각도·구도는 담당이 정한다. STORY-001 §15.3 에 카일 검술 표현안(받아 흘리기·비껴 베기·낮게 피해 끊기)이 있다. 참고만 하고 따르지 않아도 된다. 인물: 카일. 남성 28세, 178cm 설정, 가는 체형·좁은 어깨(근육질 금지). 창백한 얼굴, 갸름한 턱, 무거운 눈꺼풀, 회색 눈, 옅은 다크서클. 흑발이 눈썹에 닿고 한쪽으로 갈라져 눈이 보인다. 수염·올백·흉터 없음. 진회색 싱글 코트(무릎 바로 위), 회백색 셔츠 단추 하나 풂, 좁은 검은 바지, 낡은 낮은 부츠. 고유색: 탁한 남색 — 안깃·소매 안쪽에만 조금. 내향적 관찰자. 무기: 고정형 한손 직검 1자루, 전체 길이 약 90cm. 가변·분리·와이어·장치 없음. 남색 불꽃·발광 없음"
