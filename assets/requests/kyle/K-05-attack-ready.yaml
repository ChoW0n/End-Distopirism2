task:
  asset_name: "kyle/K-05-attack-ready"
  purpose: "sprite"
  requested_change: "[공격 준비] 사선 베기 직전. 검을 오른 어깨 위 뒤쪽으로 끌어올리고 앞발을 반 걸음 옆으로 빼 둔다. K-06 과 이어지는 방향. 인물: 카일. 남성 28세, 178cm 설정, 가는 체형·좁은 어깨(근육질 금지). 창백한 얼굴, 갸름한 턱, 무거운 눈꺼풀, 회색 눈, 옅은 다크서클. 흑발이 눈썹에 닿고 한쪽으로 갈라져 눈이 보인다. 수염·올백·흉터 없음. 진회색 싱글 코트(무릎 바로 위), 회백색 셔츠 단추 하나 풂, 좁은 검은 바지, 낡은 낮은 부츠. 고유색: 탁한 남색 — 안깃·소매 안쪽에만 조금. 무기: 고정형 한손 직검 1자루, 전체 길이 약 90cm. 가변·분리·와이어·장치 없음. 남색 불꽃·발광 없음"
  approved_base_version: "K-01-idle 승인본"
  input_files: []
  references:
    - file: "assets/requests/kyle/K-00-sword-structure 승인본"
      role: "equipment"
      inspected: false
    - file: "카일 시트 (기존 생성본, 미승인 — 얼굴·의상 참고만)"
      role: "identity"
      inspected: false
    - file: "assets/helper/frames/00-idle.png (조력자 전투 장)"
      role: "style"
      inspected: false

constraints:
  anatomical_handedness: "오른손잡이. 검은 오른손으로만 쥔다"
  weapon_mount: "검집은 왼쪽 허리. 넓은 면이 왼쪽 허벅지 바깥을 따라 눕고 손잡이는 앞, 끝은 뒤쪽 아래. 전투 자세에선 검을 뽑았으므로 빈 검집이 달려 있다"
  camera_view: "기존 조력자·소각원 전투 장과 같은 시점: 몸 3/4 측면, 눈높이보다 약간 위에서 내려다봄. 발끝까지 전신"
  facing: "화면 오른쪽을 본다. 이때 왼쪽 몸이 카메라 쪽이라 빈 검집(넓은 면)이 앞에 보이고, 검 쥔 오른손은 먼 쪽에 있다. 좌우 반전으로 만들지 않는다"
  target_height_px: "캐릭터 키(정수리~발바닥) 1400px 이상. 무기 끝·머리카락·발이 잘리지 않게 사방 여백. 정규화(키 700px·WebP)는 반입 도구가 한다 (SPEC-006 §3.1)"
  proportion: "기존 조력자·소각원 전투 장과 같은 등신. 하반신을 늘리지 않는다. 나란히 놓고 비교한다"
  tone: "캐릭터 셀화풍: 검은 외곽선 + 평면 2~3단 셰이딩. 무채색 바탕 + 고유색 1개(낮은 채도). 배경 질감(녹·균열)을 몸·옷에 덧씌우지 않는다 (CLAUDE.md · STORY-001 §18)"
  one_file_per_pose: true
  no_text_in_image: true
  output_alpha: "투명 배경 (RGBA). 배경 알파 0. 바닥 그림자를 그리지 않는다 (코드가 그린다)"
  runtime_blend_mode: "일반 알파"
  preserve:
    - "K-01 승인본의 얼굴·눈 색·머리 모양·등신"
    - "K-00 승인본의 검·검집 구조(길이·두께·코등이·손잡이·부품 수)"
    - "코트 길이와 단추 위치"
  allowed_changes: []
  note: "SPEC-006 A 등급 8장. 사이 움직임은 코드 몸짓이 맡는다. 적은 반대편(화면 오른쪽)에 있다"

